<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer athletic subtle ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Glowing Dumbbell & Crest Shape -->
  <g filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="196" y="244" width="120" height="24" rx="12" fill="url(#accentGrad)" />
    
    <!-- Left Weight Plates -->
    <rect x="156" y="196" width="28" height="120" rx="12" fill="url(#accentGrad)" />
    <rect x="120" y="216" width="24" height="80" rx="8" fill="url(#accentGrad)" opacity="0.85" />
    
    <!-- Right Weight Plates -->
    <rect x="328" y="196" width="28" height="120" rx="12" fill="url(#accentGrad)" />
    <rect x="368" y="216" width="24" height="80" rx="8" fill="url(#accentGrad)" opacity="0.85" />

    <!-- Stylized "S" Lightning Monogram -->
    <path d="M 276 160 C 240 160 220 180 220 205 C 220 235 292 230 292 265 C 292 290 270 305 236 305" 
          fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Golden Crown / Apex for PR & Excellence -->
  <polygon points="256,128 274,152 296,138 284,170 228,170 216,138 238,152" fill="url(#goldGrad)" />
</svg>
